services:
  repository-mcp:
    build:
      context: .
      dockerfile: mcp-servers/repository-mcp/Dockerfile
    environment:
      WORKSPACE_ROOT: /workspaces
      HOST: 0.0.0.0
      PORT: "8000"
      MAX_READ_LINES: ${MAX_READ_LINES:-200}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-1048576}
      MAX_SEARCH_HITS: ${MAX_SEARCH_HITS:-50}
      MAX_DIRECTORY_ENTRIES: ${MAX_DIRECTORY_ENTRIES:-200}
      CLONE_TIMEOUT_SECONDS: ${CLONE_TIMEOUT_SECONDS:-60}
      TOOL_TIMEOUT_SECONDS: ${TOOL_TIMEOUT_SECONDS:-30}
      MAX_PYTHON_FILES: ${MAX_PYTHON_FILES:-200}
      MAX_SYMBOLS: ${MAX_SYMBOLS:-500}
      MAX_REFERENCES: ${MAX_REFERENCES:-50}
      INDEX_TIMEOUT_SECONDS: ${INDEX_TIMEOUT_SECONDS:-30}
      GIT_CLONE_DEPTH: ${GIT_CLONE_DEPTH:-50}
      RESOURCE_MAX_CHARS: ${RESOURCE_MAX_CHARS:-8000}
      DATABASE_URL: postgresql://investigator:investigator@postgres:5432/investigator
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ALLOW_LOCAL_GIT: ${ALLOW_LOCAL_GIT:-}
    volumes:
      - workspaces:/workspaces
      - fixture-src:/fixtures
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  git-mcp:
    build:
      context: .
      dockerfile: mcp-servers/git-mcp/Dockerfile
    environment:
      WORKSPACE_ROOT: /workspaces
      HOST: 0.0.0.0
      PORT: "8001"
      TOOL_TIMEOUT_SECONDS: ${TOOL_TIMEOUT_SECONDS:-30}
      DEFAULT_PAGE_SIZE: ${DEFAULT_PAGE_SIZE:-20}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE:-50}
      MAX_DIFF_LINES: ${MAX_DIFF_LINES:-200}
      MAX_BRANCHES: ${MAX_BRANCHES:-50}
      DATABASE_URL: postgresql://investigator:investigator@postgres:5432/investigator
    volumes:
      - workspaces:/workspaces:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  analysis-mcp:
    build:
      context: .
      dockerfile: mcp-servers/analysis-mcp/Dockerfile
    environment:
      WORKSPACE_ROOT: /workspaces
      HOST: 0.0.0.0
      PORT: "8002"
      ANALYSIS_TIMEOUT: ${ANALYSIS_TIMEOUT:-30}
      MAX_PYTHON_FILES: ${MAX_PYTHON_FILES:-200}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-1048576}
      MAX_FUNCTIONS: ${MAX_FUNCTIONS:-500}
      MAX_CLASSES: ${MAX_CLASSES:-500}
      MAX_ENDPOINTS: ${MAX_ENDPOINTS:-200}
      MAX_EDGES: ${MAX_EDGES:-500}
      MAX_HINTS: ${MAX_HINTS:-200}
      RESOURCE_MAX_CHARS: ${RESOURCE_MAX_CHARS:-8000}
      DEFAULT_PAGE_SIZE: ${DEFAULT_PAGE_SIZE:-20}
      MAX_PAGE_SIZE: ${MAX_PAGE_SIZE:-50}
      DATABASE_URL: postgresql://investigator:investigator@postgres:5432/investigator
    volumes:
      - workspaces:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "8003"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      REPOSITORY_MCP_URL: http://repository-mcp:8000/mcp
      GIT_MCP_URL: http://git-mcp:8001/mcp
      ANALYSIS_MCP_URL: http://analysis-mcp:8002/mcp
      MAX_STEPS: ${MAX_STEPS:-8}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-12}
      MAX_TOOL_OUTPUT_CHARS: ${MAX_TOOL_OUTPUT_CHARS:-4000}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-60}
      MAX_RETRIES: ${MAX_RETRIES:-2}
      AGENT_TEST_MODEL: ${AGENT_TEST_MODEL:-}
    depends_on:
      repository-mcp:
        condition: service_healthy
      git-mcp:
        condition: service_healthy
      analysis-mcp:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: investigator
      POSTGRES_PASSWORD: investigator
      POSTGRES_DB: investigator
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investigator -d investigator"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8004:8004"
    environment:
      HOST: 0.0.0.0
      PORT: "8004"
      DATABASE_URL: postgresql://investigator:investigator@postgres:5432/investigator
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_ROOT: /workspaces
      REPOSITORY_MCP_URL: http://repository-mcp:8000/mcp
      GIT_MCP_URL: http://git-mcp:8001/mcp
      ANALYSIS_MCP_URL: http://analysis-mcp:8002/mcp
      AGENT_URL: http://agent:8003
      IMPORTS_PER_MINUTE: ${IMPORTS_PER_MINUTE:-10}
      ANALYSES_PER_MINUTE: ${ANALYSES_PER_MINUTE:-5}
      WORKSPACE_TTL_SECONDS: ${WORKSPACE_TTL_SECONDS:-604800}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      MAX_FILE_ROWS: ${MAX_FILE_ROWS:-2000}
      ALICE_TOKEN: ${ALICE_TOKEN:-alice-local-token}
      BOB_TOKEN: ${BOB_TOKEN:-bob-local-token}
      MAX_CONCURRENT_IMPORTS: ${MAX_CONCURRENT_IMPORTS:-2}
      MAX_ANALYSIS_JOBS: ${MAX_ANALYSIS_JOBS:-3}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1000000}
    volumes:
      - workspaces:/workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      repository-mcp:
        condition: service_healthy
      git-mcp:
        condition: service_healthy
      analysis-mcp:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runtime
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: mcp-servers/repository-mcp/Dockerfile
    environment:
      ALLOW_LOCAL_GIT: "1"
      WORKSPACE_ROOT: /tmp/test-workspaces
    command: ["pytest", "-q"]

  git-tests:
    profiles: ["test-git"]
    build:
      context: .
      dockerfile: mcp-servers/git-mcp/Dockerfile
    environment:
      WORKSPACE_ROOT: /tmp/test-workspaces
    command: ["pytest", "-q"]

  analysis-tests:
    profiles: ["test-analysis"]
    build:
      context: .
      dockerfile: mcp-servers/analysis-mcp/Dockerfile
    environment:
      WORKSPACE_ROOT: /tmp/test-workspaces
    command: ["pytest", "-q"]

  agent-tests:
    profiles: ["test-agent"]
    build:
      context: .
      dockerfile: agent/Dockerfile
    environment:
      AGENT_TEST_MODEL: scripted
    command: ["pytest", "-q"]

  smoke:
    profiles: ["smoke"]
    build:
      context: .
      dockerfile: mcp-servers/repository-mcp/Dockerfile
    depends_on:
      repository-mcp:
        condition: service_healthy
      git-mcp:
        condition: service_healthy
      analysis-mcp:
        condition: service_healthy
      agent:
        condition: service_healthy
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    environment:
      SMOKE_BASE_URL: http://repository-mcp:8000
      GIT_SMOKE_BASE_URL: http://git-mcp:8001
      ANALYSIS_SMOKE_BASE_URL: http://analysis-mcp:8002
      AGENT_SMOKE_BASE_URL: http://agent:8003
      API_SMOKE_BASE_URL: http://api:8004
      FRONTEND_SMOKE_BASE_URL: http://frontend:3000
    command: ["pytest", "-q", "tests/smoke"]

  api-tests:
    profiles: ["test-api"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_BASE_URL: http://api:8004
      DATABASE_URL: postgresql://investigator:investigator@postgres:5432/investigator
      REDIS_URL: redis://redis:6379/0
      WORKSPACE_ROOT: /workspaces
      FIXTURE_SOURCE: /opt/fixtures/service_app
      FIXTURE_DEST: /fixtures/service_app
      INJECTION_SOURCE: /opt/fixtures/injection_repo
      INJECTION_DEST: /fixtures/injection_repo
      ALICE_TOKEN: ${ALICE_TOKEN:-alice-local-token}
      BOB_TOKEN: ${BOB_TOKEN:-bob-local-token}
    volumes:
      - workspaces:/workspaces
      - fixture-src:/fixtures
    depends_on:
      api:
        condition: service_healthy
    command: ["pytest", "-q"]

  frontend-tests:
    profiles: ["test-frontend"]
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: test
    environment:
      FRONTEND_BASE_URL: http://frontend:3000
      ALICE_TOKEN: ${ALICE_TOKEN:-alice-local-token}
      FIXTURE_SOURCE: /opt/fixtures/service_app
      FIXTURE_DEST: /fixtures/service_app
    volumes:
      - fixture-src:/fixtures
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["npx", "playwright", "test"]

  mcp-inspector:
    profiles: ["inspect"]
    build:
      context: ./mcp-servers/mcp-inspector
    ports:
      - "127.0.0.1:6274:6274"
    depends_on:
      repository-mcp:
        condition: service_healthy

volumes:
  workspaces:
  postgres-data:
  fixture-src:
