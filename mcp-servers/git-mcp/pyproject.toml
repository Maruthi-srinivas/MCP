[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "git-mcp"
version = "0.3.0"
description = "Read-only Git MCP server (V0.3)."
requires-python = ">=3.12"
dependencies = [
    "mcp==1.25.0",
    "uvicorn==0.34.2",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
