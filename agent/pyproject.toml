[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent"
version = "0.5.0"
description = "Bounded investigation agent (V0.5)."
requires-python = ">=3.12"
dependencies = [
    "langgraph==0.3.34",
    "langchain-openai==0.3.16",
    "mcp==1.25.0",
    "uvicorn==0.34.2",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
