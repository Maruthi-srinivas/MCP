[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api"
version = "0.7.0"
description = "HTTP API for imports, analysis jobs, and investigation traces."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "psycopg[binary]==3.2.9",
    "redis==5.2.1",
    "httpx==0.28.1",
    "mcp==1.25.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
